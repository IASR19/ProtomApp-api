name: Prod CI/CD

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure database schema exists
        run: |
          node -e "
            const { Client } = require('pg');
            const client = new Client({
              host: process.env.DB_HOST,
              port: parseInt(process.env.DB_PORT || '5432'),
              user: process.env.DB_USER,
              password: process.env.DB_PASS,
              database: process.env.DB_NAME,
              ssl: process.env.DB_HOST !== 'localhost' ? { rejectUnauthorized: false } : false
            });
            client.connect()
              .then(() => client.query('CREATE SCHEMA IF NOT EXISTS \"' + (process.env.DB_SCHEMA || 'app') + '\";'))
              .then(() => { console.log('Schema ensured successfully'); client.end(); })
              .catch(err => { console.error('Error ensuring schema:', err); process.exit(1); });
          "
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}

      - name: Run database migrations
        run: npm run migration:run
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}

      - name: Assemble runtime artifact
        run: |
          mkdir -p runtime
          cp package.json runtime/
          if [ -f package-lock.json ]; then cp package-lock.json runtime/; fi
          cp -R dist runtime/dist
          cd runtime
          npm ci --omit=dev --ignore-scripts

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact
          path: runtime/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway (Production)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_NAME }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
